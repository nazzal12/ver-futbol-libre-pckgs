name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-no-leak.mjs
      - run: node scripts/gen-fixtures.mjs && git diff --exit-code fixtures/vectors.json

  js:
    runs-on: ubuntu-latest
    needs: leak-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test js/test/*.test.js

  python:
    runs-on: ubuntu-latest
    needs: leak-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e python
      - run: python -m unittest discover -s python/tests -v

  rust:
    runs-on: ubuntu-latest
    needs: leak-guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml

  dart:
    runs-on: ubuntu-latest
    needs: leak-guard
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: dart
      - run: dart test
        working-directory: dart
