[package]
name = "futbol-libre-hoy"
version = "1.0.0"
edition = "2021"
description = "Futbol Libre Hoy — today's football fixtures from Futbol Libre"
license = "MIT"
repository = "https://github.com/nazzal12/ver-fubtol-libre-pckgs"
homepage = "https://verfutbollibre.net"
readme = "README.md"
keywords = ["football", "soccer", "futbol-libre", "scores"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "futbol-libre-hoy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
